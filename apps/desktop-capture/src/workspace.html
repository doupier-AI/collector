<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Collector Workspace</title><link rel="stylesheet" href="workspace.css"></head>
<body><main class="app-shell">
  <aside class="sidebar"><div class="app-name"><span class="brand-mark">C</span><strong>Collector</strong></div><nav><button id="nav-inbox" class="nav-item active"><span>收件箱</span><b id="inbox-count">0</b></button><button id="nav-topics" class="nav-item"><span>主题</span><b id="topic-count">0</b></button></nav><div class="sidebar-spacer"></div><button id="new-capture" class="quiet-action">＋ 快速采集</button><button id="open-settings" class="quiet-action">设置</button></aside>
  <section class="collection-pane"><header><div><span class="eyebrow">KNOWLEDGE</span><h1 id="collection-title">收件箱</h1></div><button id="refresh" class="icon-button" title="刷新">↻</button></header><input id="search" class="search" placeholder="搜索当前列表"><div id="collection-list" class="collection-list"></div></section>
  <section id="detail" class="detail-pane"><div class="empty-state"><span class="empty-glyph">⌘</span><h2>选择一条内容</h2><p>查看原文、引用、模型运行和审核建议。</p></div></section>
</main><script type="module" src="workspace-renderer.js"></script></body></html>
