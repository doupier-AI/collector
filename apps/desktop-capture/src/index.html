<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Collector</title><link rel="stylesheet" href="styles.css"></head>
<body class="capture-page">
  <main class="capture-shell">
    <header class="capture-header"><div class="brand-mark">C</div><span>Collector</span><nav><button id="open-workspace" class="icon-button" type="button" title="知识工作台">⌘</button><button id="open-settings" class="icon-button" type="button" title="设置">···</button></nav></header>
    <form id="capture-form" class="composer">
      <textarea id="content" autofocus aria-label="采集内容" placeholder="粘贴一段内容、一个链接，或拖入文件…"></textarea>
      <div id="attachments" class="attachments" aria-live="polite"></div>
      <footer class="composer-footer">
        <div class="left-actions"><button id="attach" class="icon-button attach-button" type="button" title="添加文件">＋</button><span id="status" data-kind="ready" aria-live="polite">内容只会在你提交后保存</span></div>
        <button id="submit-button" class="submit-button" type="submit" disabled><span>收集</span><kbd>Ctrl ↵</kbd></button>
      </footer>
      <input id="file-input" type="file" hidden multiple accept=".txt,.md,.pdf,.png,.jpg,.jpeg,.webp">
    </form>
  </main>
  <script type="module" src="renderer.js"></script>
</body></html>
