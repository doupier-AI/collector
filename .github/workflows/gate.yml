name: Collector gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Show toolchain
        run: git --version; node --version; npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run fast gate
        run: npm run gate:fast
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run parallel E2E gate
        run: npm run gate:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-${{ github.run_id }}
          path: apps/web/test-results-gate-*
          if-no-files-found: ignore
          retention-days: 7
